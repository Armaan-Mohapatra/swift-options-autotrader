name: Swift paper-only full regression audit
on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    env:
      PAPER_ONLY: 'true'
      LIVE_ENABLED: 'false'
      ALLOW_BROKER_WRITES: 'false'
      PAPER_DISPATCH_ENABLED: 'false'
      TELEGRAM_ENABLED: 'false'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # pinned v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned uv resolver
        run: python -m pip install uv==0.10.0
      - name: Install reproducible locked dev, Telegram, and read-only market dependencies
        run: uv sync --locked --extra dev --extra telegram --extra paper-market
      - name: Lint
        run: uv run --locked --extra dev --extra telegram --extra paper-market python -m ruff check .
      - name: Syntax compile
        run: uv run --locked --extra dev --extra telegram --extra paper-market python -m compileall -q src
      - name: Unit and integration tests (synthetic only)
        run: uv run --locked --extra dev --extra telegram --extra paper-market python -m pytest -q
      - name: Verify Phase 7 paper-only invariants
        run: uv run --locked --extra dev --extra telegram --extra paper-market python scripts/phase7_verify.py
      - name: Run final end-to-end acceptance tests explicitly
        run: uv run --locked --extra dev --extra telegram --extra paper-market python -m pytest -q tests/integration/test_phase7_end_to_end.py
      - name: Verify Telethon pin
        run: uv run --locked --extra dev --extra telegram --extra paper-market python -c "import telethon; assert telethon.__version__ == '1.45.0'"
      - name: Validate locked dependency versions and hashes
        run: uv run --locked --extra dev --extra telegram --extra paper-market python scripts/audit_lock.py
      - name: Static secret scan
        run: uv run --locked --extra dev --extra telegram --extra paper-market python scripts/scan_secrets.py

