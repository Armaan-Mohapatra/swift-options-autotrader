name: Phase 1 read-only checks
on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # pinned v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned uv resolver
        run: python -m pip install uv==0.10.0
      - name: Install reproducible locked dev and Telegram dependencies
        run: uv sync --locked --extra dev --extra telegram
      - name: Lint
        run: uv run --locked --extra dev --extra telegram python -m ruff check .
      - name: Syntax compile
        run: uv run --locked --extra dev --extra telegram python -m compileall -q src
      - name: Unit and integration tests (synthetic only)
        run: uv run --locked --extra dev --extra telegram python -m pytest -q
      - name: Verify Telethon pin
        run: uv run --locked --extra dev --extra telegram python -c "import telethon; assert telethon.__version__ == '1.45.0'"
      - name: Validate locked dependency versions and hashes
        run: uv run --locked --extra dev --extra telegram python scripts/audit_lock.py
      - name: Static secret scan
        run: uv run --locked --extra dev --extra telegram python scripts/scan_secrets.py

