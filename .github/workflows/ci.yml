name: Phase 1 read-only checks
on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # pinned v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned direct dev and Telegram dependencies
        run: python -m pip install -e ".[dev,telegram]"
      - name: Lint
        run: python -m ruff check .
      - name: Syntax compile
        run: python -m compileall -q src
      - name: Unit and integration tests (synthetic only)
        run: python -m pytest -q
      - name: Verify Telethon pin
        run: python -c "import telethon; assert telethon.__version__ == '1.45.0'"
      - name: Static secret scan
        run: python scripts/scan_secrets.py

  dependency-lock-preview:
    name: Dependency lock generation (temporary audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned resolver
        run: python -m pip install uv==0.10.0
      - name: Resolve universal lock
        run: uv lock
      - name: Emit public dependency lock for reviewed commit
        run: python -c "from pathlib import Path; print('UVLOCK_START'); print(Path('uv.lock').read_text(encoding='utf-8')); print('UVLOCK_END')"
