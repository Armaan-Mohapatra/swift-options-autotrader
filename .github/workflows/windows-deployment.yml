name: Phase 6 isolated Windows deployment checks
on:
  push:
    branches: ["codex/phase6-windows-deployment"]
  pull_request:
    paths:
      - "deployment/windows/**"
      - "src/swift_autotrader/windows_*.py"
      - "scripts/build_windows_package.py"
      - "tests/**/*windows*"
      - ".github/workflows/windows-deployment.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-windows-smoke:
    name: Isolated Windows dry-run and installation rehearsal
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # SHA pinned v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # SHA pinned v5
        with:
          python-version: "3.11"
      - name: Parse every Windows PowerShell deployment script (no execution)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem -Path deployment\windows -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw ("PowerShell syntax failed: " + $_.Name) }
          }
      - name: Verify non-mutating installation preview in nonexistent temporary directory
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'SwiftPhase6PreviewNeverCreated'
          if (Test-Path -LiteralPath $root) { throw 'Unexpected test root exists' }
          .\deployment\windows\setup.ps1 -DryRun -SourceRoot $PWD.Path -InstallRoot $root
          if (Test-Path -LiteralPath $root) { throw 'Dry run wrote to disk!' }
      - name: Install exact locked synthetic test dependencies
        run: |
          python -m pip install uv==0.10.0
          uv sync --locked --extra dev --extra telegram
          uv run --locked --extra dev --extra telegram python -m pytest -q tests/unit/test_windows_runtime.py tests/unit/test_windows_status_notifications.py tests/unit/test_windows_package.py tests/integration/test_windows_deployment_contract.py
      - name: Rehearse real installer in CI disposable folder, no scheduled task or credentials
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'SwiftPhase6IsolatedInstall'
          $sha = (& git rev-parse HEAD).Trim()
          .\deployment\windows\setup.ps1 -Apply -ExpectedCommit $sha -SourceRoot $PWD.Path -InstallRoot $root -NoSchedule -Confirm:$false
          $python = Join-Path $root ("releases\$sha\.venv\Scripts\python.exe")
          & $python -m swift_autotrader smoke
          .\deployment\windows\manage.ps1 -Action Status -InstallRoot $root
          .\deployment\windows\manage.ps1 -Action Backup -InstallRoot $root -Confirm:$false
          .\deployment\windows\manage.ps1 -Action Uninstall -InstallRoot $root -Confirm:$false
          if (-not (Test-Path -LiteralPath (Join-Path $root 'data\swift.sqlite3'))) { throw 'Uninstall discarded state' }
      - name: Verify all local paper-only files and build SHA-bound, no-secret ZIP
        run: |
          python scripts/build_windows_package.py --source . --output "${{ runner.temp }}/swift-phase6-paper-package.zip" --expected-commit "${{ github.sha }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 Node24
        with:
          name: swift-phase6-windows-paper-${{ github.sha }}
          path: ${{ runner.temp }}/swift-phase6-paper-package.zip
          if-no-files-found: error
          retention-days: 14
