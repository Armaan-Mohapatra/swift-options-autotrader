[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "swift-options-autotrader"
version = "0.1.0"
description = "Read-only authorized Telegram ingestion for a future paper-only options system"
requires-python = ">=3.11"
license = {text = "Proprietary - private project"}
authors = [{name = "Swift Options AutoTrader maintainers"}]
dependencies = []

[project.optional-dependencies]
telegram = ["Telethon==1.45.0"]
dev = ["pytest==9.2.0", "ruff==0.16.8"]

[project.scripts]
swift-autotrader = "swift_autotrader.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"swift_autotrader.database" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
