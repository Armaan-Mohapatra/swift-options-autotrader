[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "swift-options-autotrader"
version = "0.1.0"
description = "Read-only authorized Telegram ingestion for a future paper-only options system"
requires-python = ">=3.11"
license = {text = "Proprietary - private project"}
authors = [{name = "Swift Options AutoTrader maintainers"}]
dependencies = [
    "tzdata>=2026.6",
]

[project.optional-dependencies]
paper-market = ["mcp==2.3.0", "httpx2>=2.10.0", "exchange-calendars", "pywin32; sys_platform == 'win32'"]
telegram = ["Telethon==1.45.0"]
dev = ["pytest==9.2.0", "ruff==0.16.8"]

[project.scripts]
swift-autotrader = "swift_autotrader.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"swift_autotrader.database" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
# review/ holds archived third-party candidate snapshots kept as audit evidence.
extend-exclude = ["review"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# Line length is not enforced: the codebase predates a formatter, and wrapping
# safety-critical code purely for style is churn. Correctness rules stay on.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# pytest fixtures are imported then requested by parameter name (F811), and
# several scenario tests keep compact one-line arrange steps.
"tests/**" = ["F811", "F841", "E701", "E702", "E402", "SIM117"]
