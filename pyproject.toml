[build-system]
requires = ["setuptools>=75,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "swift-options-autotrader"
version = "0.0.1"
description = "Phase 0 foundation for a paper-only Swift Telegram options trading research application"
requires-python = ">=3.11"
license = {text = "Proprietary - private project"}
authors = [{name = "Swift Options AutoTrader maintainers"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.16.8"]

[project.scripts]
swift-autotrader = "swift_autotrader.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"swift_autotrader.database" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
